services:
  koral-chat:
    build: .
    ports:
      - "3000:3000"
    environment:
      KORAL_HOST: "0.0.0.0"
      KORAL_PORT: "3000"
      KORAL_JWT_SECRET: "${KORAL_JWT_SECRET:-change-me-in-production}"
      KORAL_DATA_DIR: "/data"
    volumes:
      - koral_data:/data
    restart: unless-stopped

volumes:
  koral_data:
